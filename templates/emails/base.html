<!doctype html>
<html lang="en">
  <head>
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DiaBeates{% endblock %}</title>
  </head>
  <body bgcolor="#f1fafb" style="margin:0; padding:0; background-color:#f1fafb;">
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#f1fafb">
      <tr>
        <td align="center" valign="top" style="padding:32px 16px;">
          <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width:560px;">
            <tr>
              <td bgcolor="#063154" style="padding:24px 28px; border-radius:12px 12px 0 0;">
                <font color="#ffffff" face="Arial, Helvetica, sans-serif" size="5"><strong>DiaBeates</strong></font><br>
                <font color="#d7eef0" face="Arial, Helvetica, sans-serif" size="2">Health screening tool</font>
              </td>
            </tr>
            <tr>
              <td bgcolor="#ffffff" style="padding:32px 28px; border:1px solid #d6e5e7; border-top:0; border-radius:0 0 12px 12px;">
                {% block content %}{% endblock %}
                <p style="margin:24px 0 0; padding-top:18px; border-top:1px solid #e5dcce; color:#4f5b66; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.5;">DiaBeates is a screening tool, not a diagnosis.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
