services:
  diabeates:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabeates
    ports:
      - "5000:5000"
      - "127.0.0.1:5000:5000"
    environment:
      - DEBUG=False
      - PORT=5000
    volumes:
      - ./logs:/app/logs
      - ./diabetes_system.db:/app/diabetes_system.db
      - ./.db.key:/app/.db.key
      - ./.db.key.dpapi:/app/.db.key.dpapi
    restart: unless-stopped
